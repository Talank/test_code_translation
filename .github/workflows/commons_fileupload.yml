name: commons cli

on:
  pull_request:

jobs:
  build:
    name: build
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
    
    env:
      PYTHONPATH: ./commons-fileupload/manual_translation

    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
    #   - name: Install xmllint (Ubuntu)
    #     if: runner.os == 'Linux'
    #     run: apt-get update && sudo apt-get install -y libxml2-utils
      - name: Install dependencies
        working-directory: ./commons-fileupload/manual_translation
        run: |
          python -m pip install --upgrade pip
          pip install pytest
      - name: run tests
        working-directory: ./commons-fileupload/manual_translation
        run: |
          python3 -m pytest --junitxml=pytest-report.xml
        #   xmllint --format pytest-report.xml -o pytest-report.xml
              