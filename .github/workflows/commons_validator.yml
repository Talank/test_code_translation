name: commons validator

on:
  push:

jobs:
  build:
    name: build
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
    
    env:
      PYTHONPATH: ./commons-validator/manual_translation

    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: show locale
        run: locale -a
      - name: Install locales (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y locales
          sudo locale-gen en_GB.UTF-8 de_DE.UTF-8
          sudo update-locale
      - name: show available timezones
        run: |
          python3 - <<'PY'
          import zoneinfo
          print(zoneinfo.available_timezones())
          PY
      - name: Install dependencies
        working-directory: ./commons-validator/manual_translation
        run: |
          python -m pip install --upgrade pip
          pip install pytest tzdata
      - name: run tests
        working-directory: ./commons-validator/manual_translation
        run: |
          python3 -m pytest --junitxml=pytest-report.xml
        #   xmllint --format pytest-report.xml -o pytest-report.xml
              